name: PortManager Compiler
run-name: PortManager backend compiling
on: [push]
jobs:
  PortManager-Compile:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: self-hosted

    runs-on: ${{matrix.runner}}
    steps:
      - name: install libraries
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install libmariadb-dev cmake -y
          sudo apt autoremove -y
      - name: clone repository
        uses: actions/checkout@v4
      - name: copy files
        run: |
          cp -r ${{github.workspace}}/* ~/
      - name: run cmake
        run: |
          mkdir build
          cd build
          cmake ..
      - name: run make
        id: generate-file-name
        run: |
          cd build
          make
          
          echo '::set-output name=result::${{matrix.runner}}-'$(arch)

      - name: upload file
        uses: actions/upload-artifact@v3
        with:
          name: ${{steps.generate-file-name.outputs.result}}
          path: build/PortManager_backend
  make-release:
    runs-on: ubuntu-latest
    needs: PortManager-Compile
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v3

      - name: ls
        run: |
          ls -la
      - name: Create tag
        id: release-tag
        run: |
          echo '::set-output name=result::'$(date +"%Y.%m.%d-%H.%M")

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release_target.txt
          asset_name: release_target.txt
          asset_content_type: text/plain
      - uses: actions/checkout@v4
      - run: |
          set -x
          assets=()
          for asset in ./*.md; do
            assets+=("-a" "$asset")
          done
          tag_name="${GITHUB_REF##*/}"
          hub release create "${assets[@]}" -m "$tag_name" "$tag_name"
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}