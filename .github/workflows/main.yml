name: PortManager Compiler
run-name: PortManager backend compiling
on: [push]
jobs:
  PortManager-Compile:
    runs-on: ubuntu-24.04
    steps:
      - name: install libraries
        run: |
          sudo apt install libmariadb-dev cmake -y
      - name: clone repository
        uses: actions/checkout@v4
      - name: copy files
        run: |
          ls -la ${{github.workspace}}
          cp -r ${{github.workspace}}/* ~/
      - name: run cmake
        run: |
          mkdir build
          cd build
          cmake ..
      - name: run make
        run: |
          make