name: PortManager Compiler
run-name: PortManager backend compiling
on: [push]
jobs:
  PortManager-Compile:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: debian12-arm64
          - platform: windows/amd64
            runner: windows-2022

    runs-on: ${{matrix.runner}}
    steps:
      - name: install libraries
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install libmariadb-dev cmake -y
          sudo apt autoremove -y
      - name: clone repository
        uses: actions/checkout@v4
      - name: copy files
        run: |
          cp -r ${{github.workspace}}/* ~/
      - name: run cmake
        run: |
          mkdir build
          cd build
          cmake ..
      - name: run make
        id: generate-file-name
        run: |
          cd build
          make
          
          echo '::set-output name=result::${{matrix.runner}}-'$(arch)
          ls -la

      - name: upload file
        uses: actions/upload-artifact@v3
        with:
          name: PortManager_backend-${{steps.generate-file-name.outputs.result}}
          path: build/PortManager_backend
  make-release:
    runs-on: ubuntu-latest
    needs: PortManager-Compile
    steps:
      - name: install gh
        run: |
          sudo apt install gh -y
      - name: clone repository
        uses: actions/checkout@v4

      - name: download artifacts
        id: download-atrifacts
        uses: actions/download-artifact@v3
      - name: ls
        run: |
          ls -la
          tree
          ls ${{steps.download-atrifacts.outputs.download-path}}
      - name: Create tag
        id: release-tag
        run: |
          echo '::set-output name=result::'$(date +"%Y.%m.%d-%H.%M")

      - run: |
          files=""
          for i in $(ls | grep "PortManager_backend-"); do 
            mv $i/PortManager_backend $i/$i;
            files+=" $i/$i";
          done;
          gh release create ${{steps.release-tag.outputs.result}} $files
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
