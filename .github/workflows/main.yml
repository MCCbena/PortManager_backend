name: PortManager Compiler
run-name: PortManager backend compiling
on: [push]
jobs:
  PortManager-Compile:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: self-hosted

    runs-on: ${{matrix.runner}}
    steps:
      - name: install libraries
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install libmariadb-dev cmake -y
          sudo apt autoremove -y
      - name: clone repository
        uses: actions/checkout@v4
      - name: copy files
        run: |
          cp -r ${{github.workspace}}/* ~/
      - name: run cmake
        run: |
          mkdir build
          cd build
          cmake ..
      - name: run make
        id: generate-file-name
        run: |
          cd build
          make
          
          echo '::set-output name=result::${{matrix.runner}}-'$(arch)
          ls

      - name: upload file
        uses: actions/upload-artifact@v3
        with:
          name: PortManager_backend-${{steps.generate-file-name.outputs.result}}
          path: build/PortManager_backend
  make-release:
    runs-on: ubuntu-latest
    needs: PortManager-Compile
    steps:
      - name: install gh
        run: |
          sudo apt install gh -y
      - name: clone repository
        uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v3
      - name: ls
        run: |
          ls -la
          tree
      - name: Create tag
        id: release-tag
        run: |
          echo '::set-output name=result::'$(date +"%Y.%m.%d-%H.%M")

      - run: |
          gh release create ${{steps.release-tag.outputs.result}} PortManager_backend-*
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
