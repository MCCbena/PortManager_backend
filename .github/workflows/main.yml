name: PortManager Compiler
run-name: PortManager backend compiling
on: [push]
jobs:
  PortManager-Compile:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: self-hosted

    runs-on: ${{matrix.runner}}
    steps:
      - name: install libraries
        run: |
          sudo apt install libmariadb-dev cmake -y
      - name: clone repository
        uses: actions/checkout@v4
      - name: copy files
        run: |
          cp -r ${{github.workspace}}/* ~/
      - name: run cmake
        run: |
          mkdir build
          cd build
          cmake ..
      - name: run make
        id: generate-file-name
        run: |
          cd build
          make
          
          echo '::set-output name=result::${{matrix.runner}}-'$(arch)

      - name: upload file
        uses: actions/upload-artifact@v3
        with:
          name: ${{steps.generate-file-name.outputs.result}}
          path: build/PortManager_backend
  make-release:
    runs-on: ubuntu-latest
    needs: PortManager-Compile
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v3

      - name: ls
        run: |
          ls -la
      - name: Create tag
        id: release-tag
        run: |
          echo '::set-output name=result::'$(date +"%Y.%m.%d"-%H:%M)
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ steps.release-tag.outputs.result }}
          release_name: Release ${{ github.ref }}
          body: |
            Changes in this Release
            - First Change
            - Second Change
          draft: false
          prerelease: false
